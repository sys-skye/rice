# kitty — the ⌘Return terminal. Docs: https://sw.kovidgoyal.net/kitty/conf/
# Reload this file without restarting: Ctrl+Shift+F5

# Colours: current-theme.conf → theme-dark.conf / theme-light.conf (switched by Appearance)
include current-theme.conf

# ── Look ─────────────────────────────────────────────────────────────
font_family      JetBrainsMono Nerd Font
font_size        11.5
window_padding_width 8 12
hide_window_decorations yes
background_opacity 0.85
cursor_shape     beam
# Cursor trail only on real jumps (8+ cells, after the cursor sat still 40 ms), fading fast
cursor_trail     40
cursor_trail_start_threshold 8
cursor_trail_decay 0.04 0.18
enable_audio_bell no
confirm_os_window_close 0

# Notify me when a command that ran 10+ s finishes while kitty isn't focused
notify_on_cmd_finish unfocused 10.0

# ── Tabs (like macOS Terminal: the bar only appears with 2+ tabs) ───
tab_bar_edge          top
tab_bar_min_tabs      2
tab_bar_style         separator
tab_separator         ""
tab_bar_margin_height 4 4
tab_title_template    "   {index}  {title[:28]}   "
active_tab_title_template "   {index}  {title[:28]}   "
active_tab_font_style bold
inactive_tab_font_style normal

# ── Keys ─────────────────────────────────────────────────────────────
# ⌘T arrives here as Ctrl+T (Hyprland sends Super+key as Ctrl+key)
map ctrl+t           new_tab_with_cwd
map ctrl+shift+t     new_tab_with_cwd
map ctrl+tab         next_tab
map ctrl+shift+tab   previous_tab
map ctrl+shift+w     close_tab
map alt+1 goto_tab 1
map alt+2 goto_tab 2
map alt+3 goto_tab 3
map alt+4 goto_tab 4
map alt+5 goto_tab 5
map alt+6 goto_tab 6
map alt+7 goto_tab 7
map alt+8 goto_tab 8
map alt+9 goto_tab 9

# ⌘C / ⌘V arrive as Ctrl+Insert / Shift+Insert
map ctrl+insert      copy_to_clipboard
map shift+insert     paste_from_clipboard
