# Started once when you log in (uwsm-app runs each as its own systemd unit)
exec-once = uwsm-app -- swaybg -i ~/Pictures/Wallpapers/current.jpg -m fill
exec-once = $scripts/bars start
exec-once = uwsm-app -- mako
exec-once = uwsm-app -- hypridle
exec-once = uwsm-app -- wl-paste --watch cliphist store
exec-once = systemctl --user start hyprpolkitagent
# nm-applet and blueman-applet start from XDG autostart (they live in the menu bar tray)

# Put your own startup apps here, e.g.:
# exec-once = uwsm-app -- firefox
