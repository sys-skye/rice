# Started once when you log in (uwsm-app runs each as its own systemd unit)
exec-once = uwsm-app -- swaybg -i ~/Pictures/Wallpapers/current.jpg -m fill
exec-once = $scripts/bars start
exec-once = uwsm-app -- mako
exec-once = uwsm-app -- hypridle
exec-once = uwsm-app -- wl-paste --watch cliphist store
exec-once = systemctl --user start hyprpolkitagent
# nm-applet and blueman-applet start from XDG autostart (they live in the menu bar tray)

# Put your own startup apps here, e.g.:
# exec-once = uwsm-app -- firefox

# Mail + passwords run hidden in the background (notifications, browser autofill); dock click shows them
exec-once = $scripts/start-hidden net.thunderbird.Thunderbird thunderbird
exec-once = $scripts/start-hidden org.keepassxc.KeePassXC keepassxc
exec-once = $scripts/hidden-apps watch   # reopening one brings it to this Space

# Reopen the windows that were open last time, on the same Spaces (and keep saving them)
exec-once = sleep 1 && $scripts/session restore

# Remove gaps left by empty Spaces, so they're always numbered 1, 2, 3…
exec-once = $scripts/compact-spaces watch
