# Keyboard shortcuts. Super = ⌘. Press Super + / to search all of these.
# bindd = MODS, KEY, Description, dispatcher, args

# ── Apps ────────────────────────────────────────────────────────────
bindd = SUPER, SPACE, Search apps (⌘↩ opens on a new Space), exec, $scripts/launcher
bindd = SUPER, RETURN, Terminal, exec, uwsm-app -- $terminal
bindd = SUPER, GRAVE, Drop-down terminal, exec, $scripts/dropdown-term
bindd = SUPER, E, Files (Finder), exec, uwsm-app -- $files
bindd = SUPER, B, Browser, exec, uwsm-app -- $browser
bindd = SUPER, ESCAPE, System menu, exec, qs ipc call panel toggle system
bindd = SUPER ALT, SPACE, Control Center, exec, qs ipc call panel toggle control
bindd = SUPER, SLASH, Keyboard shortcuts, exec, qs ipc call panel toggle keybinds
bindd = SUPER SHIFT, V, Clipboard history, exec, $scripts/clipboard
bindd = SUPER SHIFT, C, Color picker, exec, hyprpicker -a -n
bindd = SUPER CTRL, Q, Lock screen, exec, loginctl lock-session
bindd = SUPER SHIFT, B, Restart menu bar and dock, exec, $scripts/bars restart

# ── Editing (⌘+key is sent to the app as Ctrl+key) ────────────────
# So ⌘C / ⌘V / ⌘T etc. work like on a Mac in browsers, editors, and terminals.
bindd = SUPER, C, Copy, sendshortcut, CTRL, Insert, activewindow
bindd = SUPER, V, Paste, sendshortcut, SHIFT, Insert, activewindow
bindd = SUPER, X, Cut, sendshortcut, CTRL, X, activewindow
bindd = SUPER, A, Select all, sendshortcut, CTRL, A, activewindow
bindd = SUPER, Z, Undo, sendshortcut, CTRL, Z, activewindow
bindd = SUPER SHIFT, Z, Redo, sendshortcut, CTRL SHIFT, Z, activewindow
bindd = SUPER, S, Save, sendshortcut, CTRL, S, activewindow
bindd = SUPER, F, Find, sendshortcut, CTRL, F, activewindow
bindd = SUPER, T, New tab, sendshortcut, CTRL, T, activewindow
bindd = SUPER SHIFT, T, Reopen closed tab, sendshortcut, CTRL SHIFT, T, activewindow
bindd = SUPER, W, Close tab, exec, $scripts/cmd-w
bindd = SUPER, N, New window, sendshortcut, CTRL, N, activewindow
bindd = SUPER, R, Reload, sendshortcut, CTRL, R, activewindow
bindd = SUPER, L, Address bar, sendshortcut, CTRL, L, activewindow
bindd = SUPER, P, Print, sendshortcut, CTRL, P, activewindow

# ── Windows ─────────────────────────────────────────────────────────
bindd = SUPER, Q, Quit app (some keep running hidden), exec, $scripts/cmd-q
bindd = SUPER, M, Minimize / restore window, exec, $scripts/minimize
bindd = SUPER SHIFT, M, Show minimized windows, togglespecialworkspace, minimized
bindd = SUPER CTRL, F, Fullscreen, fullscreen, 0
bindd = SUPER ALT, F, Float / tile window, exec, hyprctl --batch "dispatch togglefloating; dispatch centerwindow"
bindd = SUPER ALT, J, Flip split direction, layoutmsg, togglesplit
bindd = SUPER CTRL, UP, Show all windows (Mission Control), exec, qs ipc call overview toggle
bindd = SUPER, TAB, Next window, cyclenext,
bindd = SUPER, TAB, , alterzorder, top
bindd = SUPER SHIFT, TAB, Previous window, cyclenext, prev
bindd = SUPER SHIFT, TAB, , alterzorder, top

bindd = SUPER, LEFT, Focus left, movefocus, l
bindd = SUPER, RIGHT, Focus right, movefocus, r
bindd = SUPER, UP, Focus up, movefocus, u
bindd = SUPER, DOWN, Focus down, movefocus, d
bindd = SUPER SHIFT, LEFT, Move window left, swapwindow, l
bindd = SUPER SHIFT, RIGHT, Move window right, swapwindow, r
bindd = SUPER SHIFT, UP, Move window up, swapwindow, u
bindd = SUPER SHIFT, DOWN, Move window down, swapwindow, d
bindde = SUPER ALT, LEFT, Shrink width, resizeactive, -60 0
bindde = SUPER ALT, RIGHT, Grow width, resizeactive, 60 0
bindde = SUPER ALT, UP, Shrink height, resizeactive, 0 -60
bindde = SUPER ALT, DOWN, Grow height, resizeactive, 0 60

# Super + drag to move, Super + right-drag to resize
bindmd = SUPER, mouse:272, Move window, movewindow
bindmd = SUPER, mouse:273, Resize window, resizewindow

# ── Spaces (workspaces) ─────────────────────────────────────────────
# Also: three-finger swipe left/right on the trackpad
bindd = SUPER CTRL, LEFT, Previous space, workspace, r-1
bindd = SUPER CTRL, RIGHT, Next space, workspace, r+1
bindd = SUPER CTRL SHIFT, LEFT, Move window to previous space, movetoworkspace, r-1
bindd = SUPER CTRL SHIFT, RIGHT, Move window to next space, movetoworkspace, r+1
bindd = SUPER CTRL ALT, LEFT, Move window to the display on the left, movewindow, mon:l
bindd = SUPER CTRL ALT, RIGHT, Move window to the display on the right, movewindow, mon:r
bindd = SUPER CTRL ALT SHIFT, LEFT, Move this space to the display on the left, movecurrentworkspacetomonitor, l
bindd = SUPER CTRL ALT SHIFT, RIGHT, Move this space to the display on the right, movecurrentworkspacetomonitor, r
bindd = SUPER, mouse_down, Next space, workspace, e+1
bindd = SUPER, mouse_up, Previous space, workspace, e-1

# Spaces are shared between displays: ⌘N brings Space N to the screen you're on
# (swapping if the other screen shows it). System Settings → Displays can make them separate.
bindd = SUPER, code:10, Space 1, focusworkspaceoncurrentmonitor, 1
bindd = SUPER, code:11, Space 2, focusworkspaceoncurrentmonitor, 2
bindd = SUPER, code:12, Space 3, focusworkspaceoncurrentmonitor, 3
bindd = SUPER, code:13, Space 4, focusworkspaceoncurrentmonitor, 4
bindd = SUPER, code:14, Space 5, focusworkspaceoncurrentmonitor, 5
bindd = SUPER, code:15, Space 6, focusworkspaceoncurrentmonitor, 6
bindd = SUPER, code:16, Space 7, focusworkspaceoncurrentmonitor, 7
bindd = SUPER, code:17, Space 8, focusworkspaceoncurrentmonitor, 8
bindd = SUPER, code:18, Space 9, focusworkspaceoncurrentmonitor, 9
bindd = SUPER ALT, code:10, Move window to space 1, movetoworkspace, 1
bindd = SUPER ALT, code:11, Move window to space 2, movetoworkspace, 2
bindd = SUPER ALT, code:12, Move window to space 3, movetoworkspace, 3
bindd = SUPER ALT, code:13, Move window to space 4, movetoworkspace, 4
bindd = SUPER ALT, code:14, Move window to space 5, movetoworkspace, 5
bindd = SUPER ALT, code:15, Move window to space 6, movetoworkspace, 6
bindd = SUPER ALT, code:16, Move window to space 7, movetoworkspace, 7
bindd = SUPER ALT, code:17, Move window to space 8, movetoworkspace, 8
bindd = SUPER ALT, code:18, Move window to space 9, movetoworkspace, 9
bindd = SUPER ALT, code:19, Move window to a new empty space, movetoworkspace, empty

# ── Screenshots (saved to ~/Pictures/Screenshots + copied) ──────────
bindd = SUPER SHIFT, code:12, Screenshot whole screen, exec, $scripts/screenshot screen
bindd = SUPER SHIFT, code:13, Screenshot selection, exec, $scripts/screenshot region
bindd = SUPER SHIFT, code:14, Screenshot selection and annotate, exec, $scripts/screenshot edit
bindd = , PRINT, Screenshot selection, exec, $scripts/screenshot region

# ── Hardware keys ───────────────────────────────────────────────────
bindeld = , XF86AudioRaiseVolume, Volume up, exec, $scripts/osd volume +5
bindeld = , XF86AudioLowerVolume, Volume down, exec, $scripts/osd volume -5
bindeld = , XF86AudioMute, Mute, exec, $scripts/osd volume mute
bindeld = , XF86AudioMicMute, Mute microphone, exec, $scripts/osd mic mute
bindeld = , XF86MonBrightnessUp, Brightness up, exec, $scripts/osd brightness +5%
bindeld = , XF86MonBrightnessDown, Brightness down, exec, $scripts/osd brightness 5%-
bindeld = , XF86KbdBrightnessUp, Keyboard light up, exec, $scripts/osd keyboard +10%
bindeld = , XF86KbdBrightnessDown, Keyboard light down, exec, $scripts/osd keyboard 10%-
bindld = , XF86AudioPlay, Play / pause, exec, playerctl play-pause
bindld = , XF86AudioPause, Play / pause, exec, playerctl play-pause
bindld = , XF86AudioNext, Next track, exec, playerctl next
bindld = , XF86AudioPrev, Previous track, exec, playerctl previous

# ── While app search is open ────────────────────────────────────────
# Keys go to fuzzel (so ⌘↩ = open on a new Space, not a terminal)
submap = launcher
bindd = SUPER, SPACE, Close search, exec, pkill -x fuzzel
submap = reset
