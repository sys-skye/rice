# Window rules (Hyprland 0.53+ syntax): https://wiki.hypr.land/Configuring/Basics/Window-Rules/

# Apps that make more sense as floating panels than tiles
windowrule = float on, match:class ^(org.pulseaudio.pavucontrol|blueman-manager|nm-connection-editor|org.gnome.Calculator|nwg-look|com.gabm.satty|imv|mpv|org.gnome.Loupe|xdg-desktop-portal-gtk|org.gnome.NautilusPreviewer)$
windowrule = size 900 600, match:class ^(org.pulseaudio.pavucontrol|blueman-manager|nm-connection-editor|nwg-look)$
windowrule = center on, match:float 1
windowrule = float on, match:title ^(Open.*|Save.*|Choose.*|.*wants to (open|save).*)$
windowrule = float on, match:class ^(floating-term)$
windowrule = size 900 560, match:class ^(floating-term)$

# System Settings (Apple menu): floating, centred, like the macOS app
windowrule = float on, match:class ^(org.quickshell)$, match:title ^(System Settings)$
windowrule = size 860 600, match:class ^(org.quickshell)$, match:title ^(System Settings)$
windowrule = center on, match:class ^(org.quickshell)$, match:title ^(System Settings)$

# About This Computer (Apple menu): small fixed card
windowrule = float on, match:class ^(about-this-computer)$
windowrule = size 990 560, match:class ^(about-this-computer)$
windowrule = center on, match:class ^(about-this-computer)$

# Picture-in-picture: small, pinned to every workspace, top-right corner
windowrule = float on, match:title ^(Picture.?in.?[Pp]icture)$
windowrule = pin on, match:title ^(Picture.?in.?[Pp]icture)$
windowrule = size 600 338, match:title ^(Picture.?in.?[Pp]icture)$
windowrule = move (monitor_w-window_w-24) 56, match:title ^(Picture.?in.?[Pp]icture)$

# Don't let apps maximize themselves out of the tiling layout
windowrule = suppress_event maximize, match:class .*

# Fix XWayland drag-and-drop ghosts
windowrule = no_focus on, match:class ^$, match:title ^$, match:xwayland 1, match:float 1, match:fullscreen 0, match:pin 0

# Frosted glass behind the menu bar, dock, Spotlight and notifications
layerrule = blur on, match:namespace ^(menubar|dock|dropdown|launcher|notifications|overview)$
layerrule = blur_popups on, match:namespace ^(menubar|dock)$
layerrule = ignore_alpha 0.2, match:namespace ^(menubar|dock|dropdown|launcher|notifications)$
layerrule = no_anim on, match:namespace ^(selection|hyprpicker|backdrop|dropdown|cheatsheet|cursortrail|overview|notchmorph|notchosd)$

# JetBrains IDEs (IntelliJ…): don't let the mouse move focus onto completion
# popups/tooltips, which would close them while you type
windowrule {
    name = jetbrains-focus
    no_follow_mouse = on
    match:class = ^(jetbrains-.*)$
}
# …and float their welcome/first-run/licence windows like the Mac versions do
windowrule = float on, match:class ^(jetbrains-.*)$, match:title ^(Welcome to .*|.*User Agreement|.*Data Sharing.*|Licen[cs]es?|Manage Licenses.*|Import .*Settings.*|Tip of the Day)$
windowrule = center on, match:class ^(jetbrains-.*)$, match:title ^(Welcome to .*|.*User Agreement|.*Data Sharing.*|Licen[cs]es?|Manage Licenses.*|Import .*Settings.*|Tip of the Day)$

# Drop-down terminal (⌘`): a kitty window in the hidden "dropdown" Space,
# half the screen wide, centred just under the menu bar (rounded like every window)
windowrule = workspace special:dropdown silent, match:class ^(dropdown-term)$
windowrule = float on, match:class ^(dropdown-term)$
windowrule = size (monitor_w*0.5) (monitor_h*0.48), match:class ^(dropdown-term)$
windowrule = move (monitor_w*0.25) 38, match:class ^(dropdown-term)$
