# Written by System Settings (Apple menu). Edits here get overwritten —
# change things in the app, or put permanent tweaks in input.conf instead.

input:sensitivity = 0.12
input:accel_profile = adaptive
input:scroll_factor = 1.00
input:natural_scroll = false
input:repeat_rate = 40
input:repeat_delay = 250
input:touchpad:natural_scroll = true
input:touchpad:tap-to-click = true
input:touchpad:tap-and-drag = true
input:touchpad:clickfinger_behavior = true
input:touchpad:disable_while_typing = true
input:touchpad:scroll_factor = 0.67

# Tiled windows
general:gaps_in = 2
general:gaps_out = 4
decoration:rounding = 14

# Three-finger swipe between Spaces
gestures:workspace_swipe_distance = 275
gestures:workspace_swipe_cancel_ratio = 0.15
gestures:workspace_swipe_min_speed_to_force = 10
gestures:workspace_swipe_forever = false

# Allow in-between display scales
debug:disable_scale_checks = 1

# Built-in display scale
monitor = eDP-1, preferred, auto, 1.850000

# External display (HDMI): mode, position, scale
monitor = HDMI-A-1, 2560x1440@120.00, -1829x0, 1.400000

# Terminal scrolling speed on the trackpad
windowrule = match:class ^(kitty|Alacritty|foot|floating-term)$, scroll_touchpad 1.50
