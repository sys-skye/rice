# Control your input devices
# Values changed in System Settings (Apple menu) are saved to settings.conf and override these.
# See https://wiki.hypr.land/Configuring/Basics/Variables/#input
input {
  # Use multiple keyboard layouts and switch between them with Left Alt + Right Alt
  # kb_layout = us,dk,eu
  kb_options = compose:caps # ,grp:alts_toggle

  # Change speed of keyboard repeat
  repeat_rate = 40
  repeat_delay = 250

  touchpad {
    # Natural (inverse) scrolling, like macOS
    natural_scroll = true

    # Use two-finger clicks for right-click instead of lower-right corner
    clickfinger_behavior = true

    # Control the speed of your scrolling
    scroll_factor = 0.4

    # Tap to click
    tap-to-click = true
  }
}

# Terminal scroll speed: set in System Settings → Trackpad & Mouse (settings.conf)

# Three-finger swipe to change workspaces
gesture = 3, horizontal, workspace

# Three-finger swipe up: see all open windows (Mission Control).
# Swipe down: go to the window under the pointer (or just close it)
gesture = 3, up, dispatcher, exec, qs ipc call overview toggle
gesture = 3, down, dispatcher, exec, qs ipc call overview commit
