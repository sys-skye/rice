# ┌──────────────────────────────────────────────────────────┐
# │  macOS-style Hyprland rice                               │
# │  Super (⌘) is the main modifier. Super + / lists keys.   │
# │  Installed with macrice (see ~/macrice/README.md)       │
# └──────────────────────────────────────────────────────────┘
# Wiki: https://wiki.hypr.land/Configuring/

$scripts  = ~/.config/hypr/scripts
$terminal = kitty
$files    = nautilus --new-window
$browser  = firefox

source = ~/.config/hypr/monitors.conf    # display + scaling
source = ~/.config/hypr/envs.conf        # environment variables
source = ~/.config/hypr/cursor.conf      # cursor theme + size (written by cursor-apply)
source = ~/.config/hypr/input.conf       # keyboard, trackpad, gestures
source = ~/.config/hypr/looknfeel.conf   # gaps, rounding, blur, animations
source = ~/.config/hypr/rules.conf       # window + layer rules
source = ~/.config/hypr/bindings.conf    # keyboard shortcuts
source = ~/.config/hypr/autostart.conf   # bar, dock, wallpaper, daemons
source = ~/.config/hypr/settings.conf    # written by System Settings (overrides the above)
source = ~/.config/hypr/appearance.conf  # written by the Light/Dark switch
