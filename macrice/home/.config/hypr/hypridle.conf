general {
    lock_cmd = pidof hyprlock || hyprlock          # lock screen
    before_sleep_cmd = loginctl lock-session        # lock before suspend
    after_sleep_cmd = hyprctl dispatch 'hl.dsp.dpms({ action = "on" })'      # turn the display back on after resume
    inhibit_sleep = 3                               # wait until screen is locked
}

# Dim the screen after 2.5 minutes
listener {
    timeout = 150
    on-timeout = brightnessctl -s -c backlight set 10%
    on-resume = brightnessctl -r -c backlight
}

# Lock after 5 minutes
listener {
    timeout = 300
    on-timeout = loginctl lock-session
}

# Screen off after 5.5 minutes
listener {
    timeout = 330
    on-timeout = hyprctl dispatch 'hl.dsp.dpms({ action = "off" })'
    on-resume = hyprctl dispatch 'hl.dsp.dpms({ action = "on" })'
}
