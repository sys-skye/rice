# macOS-ish look: soft rounded corners, big diffuse shadows, frosted blur

general {
    gaps_in = 4
    gaps_out = 9
    border_size = 1
    col.active_border = rgba(ffffff30)
    col.inactive_border = rgba(ffffff12)
    resize_on_border = true          # drag window edges to resize, like macOS
    layout = dwindle
}

decoration {
    rounding = 12
    rounding_power = 3               # squircle-like corners

    active_opacity = 1.0
    inactive_opacity = 1.0

    shadow {
        enabled = true
        range = 30
        render_power = 4
        offset = 0 8
        color = rgba(00000070)
        color_inactive = rgba(00000040)
    }

    blur {
        enabled = true
        size = 8
        passes = 3
        noise = 0.02
        vibrancy = 0.25
        popups = true
    }
}

animations {
    enabled = true
    bezier = macOut, 0.16, 1, 0.3, 1
    bezier = macIn, 0.7, 0, 0.84, 0
    bezier = smooth, 0.25, 0.1, 0.25, 1

    animation = windowsIn, 1, 4, macOut, popin 90%
    animation = windowsOut, 1, 3, macIn, popin 90%
    animation = windowsMove, 1, 4, macOut
    animation = fade, 1, 3, smooth
    animation = border, 1, 5, smooth
    animation = layersIn, 1, 3, macOut, slide
    animation = layersOut, 1, 2, macIn, fade
    animation = workspaces, 1, 5, macOut, slide       # Spaces-style sliding
    animation = specialWorkspace, 1, 3, smooth, fade         # hidden Spaces (minimized, drop-down terminal)
}

dwindle {
    preserve_split = true
}

misc {
    disable_hyprland_logo = true
    disable_splash_rendering = true
    focus_on_activate = true
    key_press_enables_dpms = true
    mouse_move_enables_dpms = true
    background_color = rgb(111122)
}

cursor {
    hide_on_key_press = true
}

binds {
    hide_special_on_workspace_change = true
}
