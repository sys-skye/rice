# Lock screen (Super+Ctrl+Q): blurred wallpaper, big clock, pill password field

general {
    ignore_empty_input = true
    hide_cursor = true
}

background {
    monitor =
    path = ~/Pictures/Wallpapers/current.jpg
    blur_passes = 3
    blur_size = 8
    brightness = 0.75
}

# Date
label {
    monitor =
    text = cmd[update:60000] date '+%A, %-d %B'
    color = rgba(255, 255, 255, 0.85)
    font_size = 22
    font_family = Inter SemiBold
    position = 0, 290
    halign = center
    valign = center
}

# Time
label {
    monitor =
    text = $TIME
    color = rgba(255, 255, 255, 0.95)
    font_size = 110
    font_family = Inter Bold
    position = 0, 180
    halign = center
    valign = center
}

# User name
label {
    monitor =
    text = $DESC
    color = rgba(255, 255, 255, 0.9)
    font_size = 15
    font_family = Inter SemiBold
    position = 0, -150
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 260, 44
    position = 0, -205
    halign = center
    valign = center
    rounding = -1
    outline_thickness = 1
    outer_color = rgba(255, 255, 255, 0.25)
    inner_color = rgba(255, 255, 255, 0.15)
    font_color = rgba(255, 255, 255, 1.0)
    check_color = rgba(10, 132, 255, 0.8)
    fail_color = rgba(255, 69, 58, 0.8)
    font_family = Inter
    placeholder_text = <span foreground="##ffffffaa">Enter Password</span>
    fail_text = <span foreground="##ffffffcc">Incorrect password</span>
    dots_size = 0.25
    dots_spacing = 0.3
    fade_on_empty = false
    shadow_passes = 0
}

animations {
    enabled = true
    animation = fadeIn, 1, 4, default
    animation = fadeOut, 1, 4, default
}
