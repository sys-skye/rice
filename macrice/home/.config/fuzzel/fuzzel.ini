# Spotlight-style launcher (Super+Space). Docs: man fuzzel.ini
[main]
# Colours come from colors.ini → colors-dark.ini / colors-light.ini (switched by Appearance)
include=~/.config/fuzzel/colors.ini
font=Inter:size=14,JetBrainsMono Nerd Font:size=14
prompt="󰍉  "
placeholder=Search
icon-theme=Papirus-Dark
icons-enabled=yes
anchor=top
y-margin=180
width=46
lines=8
horizontal-pad=18
vertical-pad=14
inner-pad=12
line-height=30
image-size-ratio=0.6
terminal=kitty
layer=overlay
fields=filename,name,generic,keywords
match-mode=fzf


[border]
width=1
radius=16
selection-radius=8
