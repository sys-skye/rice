# Spotlight-style launcher (Super+Space). Docs: man fuzzel.ini
[main]
# Colours come from colors.ini → colors-dark.ini / colors-light.ini (switched by Appearance)
include=~/.config/fuzzel/colors.ini
font=Inter:size=15,JetBrainsMono Nerd Font:size=15
prompt="󰍉  "
placeholder=Search
icon-theme=Papirus-Dark
icons-enabled=yes
anchor=top
y-margin=200
width=44
lines=7
horizontal-pad=22
vertical-pad=14
inner-pad=14
line-height=32
image-size-ratio=0.7
terminal=kitty
layer=overlay
fields=filename,name,generic,keywords
match-mode=fzf


[border]
width=1
radius=30
selection-radius=12

[key-bindings]
# ⌘↩ = open on a new Space (see ~/.config/hypr/scripts/launcher); ⌘V pastes
custom-1=Mod4+Return Mod4+KP_Enter
clipboard-paste=Control+v Mod4+v XF86Paste
